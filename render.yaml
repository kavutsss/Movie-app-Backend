services:
  - type: web
    name: movie-app-api
    runtime: docker
    region: oregon
    plan: free
    
    # Environment variables
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: movie-app-api.onrender.com,localhost,127.0.0.1
      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        value: moviedb
      - key: DB_USER
        fromDatabase:
          name: moviedb
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: moviedb
          property: password
      - key: DB_HOST
        fromDatabase:
          name: moviedb
          property: host
      - key: DB_PORT
        value: "5432"
      - key: CORS_ALLOWED_ORIGINS
        value: https://movie-app-frontend.onrender.com,http://localhost:3000,http://localhost:5173
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

    # Health check
    healthCheckPath: /api/

    # Pre-deployment script (runs migrations)
    preDeployCommand: python manage.py migrate --noinput

databases:
  - name: moviedb
    plan: free
    region: oregon

